```html
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10111a">
<title>Groq Lab | ホーム</title>
<style>
:root {
  color-scheme: dark;
  --bg: #10111a;
  --panel: #191b29;
  --border: #303348;
  --text: #f3f4ff;
  --sub: #a5a9c2;
  --accent: #9b8cff;
  --accent2: #55d6be;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(ellipse at 50% -20%, #34305e 0%, transparent 55%),
    var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}
a { color: inherit; text-decoration: none; }
.wrap { width: min(1000px, 92%); margin: auto; }
header {
  padding: 25px 0;
  border-bottom: 1px solid #ffffff12;
}
.header-inner {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
}
.logo { font-size: 20px; font-weight: 900; letter-spacing: 1px; }
.logo span { color: var(--accent); }
.header-label { font-size: 12px; color: var(--sub); }
.hero { padding: 58px 0 35px; }
.eyebrow {
  color: var(--accent2);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 3px;
}
h1 {
  font-size: clamp(32px, 6vw, 52px);
  line-height: 1.15;
  margin: 15px 0;
  letter-spacing: -1.5px;
}
h1 span {
  background: linear-gradient(90deg, #b7aaff, #67e5d1);
  color: transparent;
  background-clip: text;
}
.description {
  color: var(--sub);
  line-height: 1.9;
  max-width: 620px;
  font-size: 14px;
}
.section-head {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 12px;
  margin: 25px 0 18px;
}
h2 { font-size: 20px; margin: 0; }
.count { color: var(--sub); font-size: 12px; }
.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
  padding-bottom: 60px;
}
.card {
  display: flex;
  flex-direction: column;
  min-height: 210px;
  padding: 22px;
  border: 1px solid var(--border);
  border-radius: 17px;
  background: linear-gradient(145deg, #202235, #171925);
  transition: transform .18s, border-color .18s, background .18s;
}
.card:hover {
  transform: translateY(-4px);
  border-color: var(--accent);
  background: linear-gradient(145deg, #292943, #191b2a);
}
.card-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.icon {
  width: 47px;
  height: 47px;
  display: grid;
  place-items: center;
  border-radius: 13px;
  background: #9b8cff19;
  border: 1px solid #9b8cff35;
  font-size: 23px;
}
.badge {
  font-size: 11px;
  border: 1px solid #454860;
  border-radius: 999px;
  padding: 5px 9px;
  color: #c9cbe0;
}
.badge.ready { color: var(--accent2); border-color: #55d6be55; }
.card h3 { font-size: 18px; margin: 18px 0 7px; }
.card p {
  color: var(--sub);
  font-size: 13px;
  line-height: 1.75;
  margin: 0 0 20px;
}
.open-link {
  color: #bcb2ff;
  font-size: 13px;
  font-weight: 800;
  margin-top: auto;
}
.open-link span { display: inline-block; transition: transform .18s; }
.card:hover .open-link span { transform: translateX(5px); }
footer {
  border-top: 1px solid #ffffff12;
  color: #777c98;
  font-size: 12px;
  padding: 22px 0 30px;
}
@media (max-width: 600px) {
  .hero { padding-top: 42px; }
  .grid { grid-template-columns: 1fr; gap: 12px; }
  .card { min-height: 190px; }
  .header-label { font-size: 10px; }
}
</style>
</head>
<body>
<header>
  <div class="wrap header-inner">
    <a class="logo" href="./index.html">GROQ <span>LAB</span></a>
    <div class="header-label">AI TOOLS & EXPERIMENTS</div>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <div class="eyebrow">YOUR AI PLAYGROUND</div>
    <h1>AIで、遊ぶ。<br><span>試す。創る。</span></h1>
    <p class="description">
      Groq APIを使ったAIアプリのホーム画面。<br>
      チャット、対話ゲームなど、ここから各ページを開けます。
    </p>
  </section>

  <section>
    <div class="section-head">
      <h2>アプリ一覧</h2>
      <span class="count" id="appCount"></span>
    </div>
    <div class="grid" id="appGrid"></div>
  </section>
</main>

<footer>
  <div class="wrap">GROQ LAB · Personal AI Projects</div>
</footer>

<script>
/*
========================================
ページ追加方法

1. 新しいHTMLファイルを、このファイルと同じ場所に置く。
2. 下の apps 配列に1項目追加する。

例：
{
  title: "新しいAIゲーム",
  description: "新しい対話ゲームの説明。",
  file: "NewGame.html",
  icon: "🎮",
  status: "公開中"
},

fileにはHTMLファイル名を正確に書く。
========================================
*/

const apps = [
  {
    title: "Groq AI チャット",
    description: "Groq APIを利用してAIと自由に会話するチャットアプリ。",
    file: "GroqChat.html",
    icon: "💬",
    status: "公開中"
  },
  {
    title: "1対1 AIロールプレイ",
    description: "AIとの対話で勝負するゲーム。説得力や信頼度などを評価し、会話の結果によって結末が変わります。",
    file: "RPGfor1ON1.html",
    icon: "⚔️",
    status: "公開中"
  }

  // 新しいページは、この下に追加できます。
];

const grid = document.getElementById("appGrid");
document.getElementById("appCount").textContent =
  `${apps.length} APPS`;

apps.forEach(app => {
  const card = document.createElement("a");
  card.className = "card";
  card.href = app.file;

  const top = document.createElement("div");
  top.className = "card-top";

  const icon = document.createElement("div");
  icon.className = "icon";
  icon.textContent = app.icon || "✨";

  const badge = document.createElement("span");
  badge.className = "badge" +
    (app.status === "公開中" ? " ready" : "");
  badge.textContent = app.status || "公開中";

  top.append(icon, badge);

  const title = document.createElement("h3");
  title.textContent = app.title;

  const description = document.createElement("p");
  description.textContent = app.description;

  const link = document.createElement("div");
  link.className = "open-link";
  link.append(document.createTextNode("アプリを開く "));
  const arrow = document.createElement("span");
  arrow.textContent = "→";
  link.appendChild(arrow);

  card.append(top, title, description, link);
  grid.appendChild(card);
});
</script>
</body>
</html>
```
