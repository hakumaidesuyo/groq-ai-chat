
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101014">
<title>Groq AI Chat</title>
<style>
:root {
  color-scheme: dark;
  --bg: #101014;
  --panel: #1b1b22;
  --line: #34343e;
  --text: #f5f5f7;
  --muted: #a4a4b2;
  --accent: #b8f36b;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  height: 100dvh;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
.app {
  height: 100dvh;
  max-width: 900px;
  margin: auto;
  display: flex;
  flex-direction: column;
}
header {
  height: 62px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  border-bottom: 1px solid var(--line);
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 800;
}
.logo {
  display: grid;
  place-items: center;
  width: 35px;
  height: 35px;
  border-radius: 12px;
  background: var(--accent);
  color: #111;
  font-size: 20px;
}
.actions { display: flex; gap: 7px; }
button.secondary {
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 9px 12px;
}
main {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 20px 14px;
}
.welcome {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding-bottom: 25px;
}
.hero {
  display: grid;
  place-items: center;
  width: 65px;
  height: 65px;
  margin-bottom: 20px;
  border-radius: 22px;
  background: #252a20;
  color: var(--accent);
  font-size: 34px;
}
h1 { font-size: 28px; margin: 0 0 10px; }
.sub {
  color: var(--muted);
  line-height: 1.7;
  font-size: 14px;
  max-width: 380px;
  margin: 0 0 24px;
}
.suggestions {
  width: 100%;
  max-width: 520px;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
}
.suggestion {
  text-align: left;
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 13px;
  font-size: 13px;
  line-height: 1.5;
}
.messages {
  display: flex;
  flex-direction: column;
  gap: 20px;
  max-width: 740px;
  margin: auto;
}
.msg { display: flex; align-items: flex-start; gap: 10px; }
.avatar {
  width: 30px;
  height: 30px;
  flex-shrink: 0;
  border-radius: 10px;
  background: #292932;
  color: var(--muted);
  display: grid;
  place-items: center;
  font-size: 12px;
  font-weight: bold;
}
.msg.user .avatar { background: var(--accent); color: #111; }
.content {
  min-width: 0;
  flex: 1;
  padding-top: 4px;
  line-height: 1.8;
  font-size: 15px;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}
.msg.user .content {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 3px 14px 14px 14px;
  padding: 10px 13px;
}
.content pre {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  background: #09090c;
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 12px;
}
.content code {
  overflow-wrap: anywhere;
  background: #09090c;
  border-radius: 4px;
  padding: 2px 4px;
}
.composer-wrap {
  flex-shrink: 0;
  padding: 10px 12px max(12px, env(safe-area-inset-bottom));
  background: linear-gradient(transparent, var(--bg) 18%);
}
.composer {
  max-width: 740px;
  margin: auto;
  border: 1px solid #41414d;
  background: var(--panel);
  border-radius: 18px;
  padding: 9px;
}
textarea {
  display: block;
  width: 100%;
  min-height: 44px;
  max-height: 150px;
  resize: none;
  border: 0;
  outline: 0;
  color: var(--text);
  background: transparent;
  padding: 9px;
  line-height: 1.5;
}
.composer-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
select {
  max-width: 80%;
  min-width: 0;
  border: 0;
  outline: 0;
  color: var(--muted);
  background: transparent;
  font-size: 12px;
}
select option { background: var(--panel); color: var(--text); }
.send {
  width: 42px;
  height: 38px;
  flex-shrink: 0;
  border: 0;
  border-radius: 12px;
  background: var(--accent);
  color: #111;
  font-size: 21px;
  font-weight: 900;
}
.send:disabled { opacity: .45; cursor: wait; }
.note {
  text-align: center;
  color: #777785;
  font-size: 10px;
  padding-top: 8px;
}
.overlay {
  position: fixed;
  inset: 0;
  z-index: 5;
  display: none;
  align-items: flex-end;
  justify-content: center;
  padding: 12px;
  background: #000a;
}
.overlay.show { display: flex; }
.sheet {
  width: 100%;
  max-width: 500px;
  max-height: 90dvh;
  overflow-y: auto;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 20px;
}
.sheet h2 { margin: 0 0 12px; font-size: 20px; }
.help { color: var(--muted); font-size: 12px; line-height: 1.7; }
.field { margin: 17px 0; }
.field label {
  display: block;
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 8px;
}
.field input {
  width: 100%;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--text);
  padding: 12px;
}
.sheet-buttons { display: flex; gap: 8px; margin-top: 18px; }
.sheet-buttons button { flex: 1; padding: 12px; border-radius: 11px; }
.primary {
  border: 0;
  background: var(--accent);
  color: #111;
  font-weight: bold;
}
#status {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6;
  overflow-wrap: anywhere;
  margin-top: 10px;
}
@media (min-width: 650px) {
  .overlay { align-items: center; }
  main { padding: 24px; }
}
@media (max-width: 360px) {
  .actions { gap: 4px; }
  button.secondary { padding: 8px; font-size: 12px; }
  .suggestions { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">G</div>
      <span>Groq AI Chat</span>
    </div>
    <div class="actions">
      <button class="secondary" id="newChat">＋ 新規</button>
      <button class="secondary" id="settingsBtn">⚙ 設定</button>
    </div>
  </header>

  <main id="main">
    <section class="welcome" id="welcome">
      <div class="hero">✦</div>
      <h1>何を話そう？</h1>
      <p class="sub">
        Groqの高速AIと会話できます。<br>
        APIキーを設定して質問を入力してください。
      </p>
      <div class="suggestions">
        <button class="suggestion">💡 面白いWebアプリのアイデアを考えて</button>
        <button class="suggestion">🧠 難しいことを初心者向けに説明して</button>
        <button class="suggestion">✍️ この文章を自然な日本語に直して</button>
        <button class="suggestion">🎮 小さなゲームの企画を考えて</button>
      </div>
    </section>
    <section class="messages" id="messages" hidden></section>
  </main>

  <div class="composer-wrap">
    <div class="composer">
      <textarea id="prompt" rows="1" placeholder="メッセージを入力…"></textarea>
      <div class="composer-bottom">
        <select id="model" aria-label="AIモデル">
          <option value="openai/gpt-oss-120b">GPT OSS 120B（高性能）</option>
          <option value="openai/gpt-oss-20b">GPT OSS 20B（高速）</option>
          <option value="qwen/qwen3.8-27b">Qwen 3.8 27B</option>
        </select>
        <button class="send" id="send" aria-label="送信">↑</button>
      </div>
    </div>
    <div class="note">Groq API使用 · APIキーはこのブラウザに保存されます</div>
  </div>
</div>

<div class="overlay" id="settings">
  <div class="sheet">
    <h2>⚙ API設定</h2>
    <p class="help">
      GroqのAPIキーを入力してください。<br>
      APIキーはGitHubのコードには保存されません。
    </p>
    <div class="field">
      <label for="apiKey">Groq API Key</label>
      <input id="apiKey" type="password" placeholder="gsk_…" autocomplete="off">
    </div>
    <div class="field">
      <label for="temperature">Temperature（創造性：0〜2）</label>
      <input id="temperature" type="number" min="0" max="2" step="0.1" value="0.7">
    </div>
    <div id="status"></div>
    <div class="sheet-buttons">
      <button class="secondary" id="clearKey">キー削除</button>
      <button class="primary" id="saveSettings">保存</button>
    </div>
    <div class="sheet-buttons">
      <button class="secondary" id="closeSettings">閉じる</button>
    </div>
  </div>
</div>

<script>
"use strict";

const $ = id => document.getElementById(id);

const KEY = "groq_chat_key";
const MODEL = "groq_chat_model";
const TEMP = "groq_chat_temp";
const HISTORY = "groq_chat_history";

const AVAILABLE_MODELS = [
  "openai/gpt-oss-120b",
  "openai/gpt-oss-20b",
  "qwen/qwen3.8-27b"
];

let history = [];
let busy = false;

try {
  const saved = JSON.parse(localStorage.getItem(HISTORY) || "[]");
  if (Array.isArray(saved)) {
    history = saved.filter(item =>
      item &&
      (item.role === "user" || item.role === "assistant") &&
      typeof item.content === "string"
    );
  }
} catch {
  history = [];
}

// 古いモデル名が保存されていても、対応モデルに切り替える
const savedModel = localStorage.getItem(MODEL);
$("model").value = AVAILABLE_MODELS.includes(savedModel)
  ? savedModel
  : "openai/gpt-oss-120b";

localStorage.setItem(MODEL, $("model").value);
$("temperature").value = localStorage.getItem(TEMP) || "0.7";

function saveHistory() {
  try {
    localStorage.setItem(HISTORY, JSON.stringify(history));
  } catch {
    // 保存できなくても会話自体は継続する
  }
}

function escapeHTML(value) {
  return value.replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function formatText(value) {
  let result = escapeHTML(value);

  result = result.replace(
    /```([\s\S]*?)```/g,
    (_, code) => "<pre><code>" + code + "</code></pre>"
  );

  result = result.replace(
    /`([^`]+)`/g,
    "<code>$1</code>"
  );

  result = result.replace(
    /\*\*(.+?)\*\*/g,
    "<strong>$1</strong>"
  );

  result = result.replace(/\n/g, "<br>");
  return result;
}

function render() {
  $("welcome").hidden = history.length > 0;
  $("messages").hidden = history.length === 0;
  $("messages").replaceChildren();

  history.forEach(item => {
    const row = document.createElement("div");
    row.className = "msg " + item.role;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = item.role === "user" ? "You" : "G";

    const content = document.createElement("div");
    content.className = "content";
    content.innerHTML = formatText(item.content);

    row.append(avatar, content);
    $("messages").appendChild(row);
  });

  $("main").scrollTop = $("main").scrollHeight;
}

function openSettings() {
  $("apiKey").value = localStorage.getItem(KEY) || "";
  $("status").textContent = "";
  $("settings").classList.add("show");
}

$("settingsBtn").onclick = openSettings;

$("closeSettings").onclick = () => {
  $("settings").classList.remove("show");
};

$("settings").addEventListener("click", event => {
  if (event.target === $("settings")) {
    $("settings").classList.remove("show");
  }
});

$("saveSettings").onclick = () => {
  const key = $("apiKey").value.trim();

  if (key) {
    localStorage.setItem(KEY, key);
  } else {
    localStorage.removeItem(KEY);
  }

  const value = Number($("temperature").value);
  const temperature = Number.isFinite(value)
    ? Math.min(2, Math.max(0, value))
    : 0.7;

  localStorage.setItem(TEMP, String(temperature));
  $("temperature").value = String(temperature);

  $("status").textContent = key
    ? "APIキーを保存しました。"
    : "APIキーを削除しました。";
};

$("clearKey").onclick = () => {
  localStorage.removeItem(KEY);
  $("apiKey").value = "";
  $("status").textContent = "APIキーを削除しました。";
};

$("newChat").onclick = () => {
  if (busy) return;

  history = [];
  saveHistory();
  render();
  $("prompt").focus();
};

$("model").onchange = () => {
  localStorage.setItem(MODEL, $("model").value);
};

document.querySelectorAll(".suggestion").forEach(button => {
  button.onclick = () => {
    $("prompt").value = button.textContent.replace(/^[^\s]+\s/, "");
    resizePrompt();
    $("prompt").focus();
  };
});

function resizePrompt() {
  $("prompt").style.height = "auto";
  $("prompt").style.height =
    Math.min($("prompt").scrollHeight, 150) + "px";
}

$("prompt").addEventListener("input", resizePrompt);

$("prompt").addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

$("send").onclick = sendMessage;

async function sendMessage() {
  if (busy) return;

  const text = $("prompt").value.trim();
  if (!text) return;

  const apiKey = localStorage.getItem(KEY);

  if (!apiKey) {
    openSettings();
    $("status").textContent = "先にGroq APIキーを入力してください。";
    return;
  }

  const model = $("model").value;

  if (!AVAILABLE_MODELS.includes(model)) {
    $("status").textContent = "モデルを選び直してください。";
    return;
  }

  history.push({ role: "user", content: text });
  $("prompt").value = "";
  resizePrompt();
  render();

  busy = true;
  $("send").disabled = true;

  const loading = document.createElement("div");
  loading.className = "msg";
  loading.id = "loading";

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = "G";

  const loadingContent = document.createElement("div");
  loadingContent.className = "content";
  loadingContent.textContent = "考え中…";

  loading.append(avatar, loadingContent);
  $("messages").appendChild(loading);
  $("main").scrollTop = $("main").scrollHeight;

  try {
    const response = await fetch(
      "https://api.groq.com/openai/v1/chat/completions",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + apiKey
        },
        body: JSON.stringify({
          model: model,
          messages: history.map(item => ({
            role: item.role,
            content: item.content
          })),
          temperature: Number(localStorage.getItem(TEMP) || "0.7"),
          stream: false
        })
      }
    );

    let data;

    try {
      data = await response.json();
    } catch {
      throw new Error("Groqから正常な応答を受け取れませんでした。");
    }

    if (!response.ok) {
      const message = data.error?.message || ("HTTP " + response.status);
      throw new Error(message);
    }

    const answer = data.choices?.[0]?.message?.content;

    if (typeof answer !== "string" || !answer.trim()) {
      throw new Error("AIから回答が返されませんでした。");
    }

    history.push({
      role: "assistant",
      content: answer
    });

  } catch (error) {
    const message = error instanceof Error
      ? error.message
      : String(error);

    history.push({
      role: "assistant",
      content:
        "エラーが発生しました。\n" +
        message +
        "\n\nモデル名、APIキー、Groqの利用制限を確認してください。"
    });

  } finally {
    busy = false;
    $("send").disabled = false;
    saveHistory();
    render();
  }
}

render();
</script>
</body>
</html>
